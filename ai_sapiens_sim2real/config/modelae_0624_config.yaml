policy_asset_roots:
- ../assets/modelae_0624
authority:
  api_entry:
    warmup_duration: 3.0
    velocity_neutral_threshold: 0.05
    allowed_from_states:
    - Damping
    - ReadyPose
    - Velocity
  default_velocity_state: Velocity
teleop_input:
  plugin: ai_sapiens_sim2real/KeyboardTeleopInputPlugin
  config: teleop/keyboard.yaml
teleop_conditions:
  DampingRequested:
    input_code: 1
  ReadyPoseRequested:
    input_code: 2
  VelocityRequested:
    input_code: 3
state_machine:
  # 0624 物理上 KNEES_BENT 非静平衡，固定姿态(ReadyPose/Damping)会因重力前倾倒下；
  # 只有策略闭环(Velocity)能像训练时那样主动平衡。故初始即进入 Velocity(0 指令=站立)。
  initial: Velocity
  states:
    Damping:
      run: damping
      transitions:
      - when: ReadyPoseRequested
        to: ReadyPose
    ReadyPose:
      run: ready_pose
      transitions:
      - when: DampingRequested
        to: Damping
      - when: VelocityRequested
        to: Velocity
    Velocity:
      run: velocity_policy
      transitions:
      - when: DampingRequested
        to: Damping
      - when: ReadyPoseRequested
        to: ReadyPose
